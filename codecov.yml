coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
    patch:
      default:
        target: 80%
        threshold: 1%

comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: core
      paths:
        - packages/core/src/
    - name: extension-block-controls
      paths:
        - packages/extension-block-controls/src/
    - name: extension-code-block-lowlight
      paths:
        - packages/extension-code-block-lowlight/src/
    - name: extension-details
      paths:
        - packages/extension-details/src/
    - name: extension-emoji
      paths:
        - packages/extension-emoji/src/
    - name: extension-image
      paths:
        - packages/extension-image/src/
    - name: extension-math
      paths:
        - packages/extension-math/src/
    - name: extension-mention
      paths:
        - packages/extension-mention/src/
    - name: extension-table
      paths:
        - packages/extension-table/src/
    - name: extension-toc
      paths:
        - packages/extension-toc/src/

ignore:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/index.ts"
  - "packages/*/src/types/"
  - "packages/*/src/icons/index.ts"
  # Framework wrappers have no unit tests; covered by E2E specs in apps/demo-*.
  # Remove from this list if unit tests are added later.
  - "packages/react/"
  - "packages/vue/"
  - "packages/angular/"
  - "apps/"
  - "examples/"
  - "domternal.dev/"
