<div class="demo">
  <h1>
    Domternal Angular Demo
    <button class="theme-toggle" (click)="toggleTheme()" [title]="isDark() ? 'Switch to light' : 'Switch to dark'">
      {{ isDark() ? '☀️' : '🌙' }}
    </button>
    <select
      #languageSelect
      class="language-select"
      aria-label="Editor language"
      data-testid="demo-language"
      [value]="language()"
      (change)="setLanguage(languageSelect.value)"
    >
      <option value="en" lang="en">English</option>
      <option value="de" lang="de">Deutsch</option>
    </select>
  </h1>

  <div class="toolbar-mode-toggle">
    <button data-testid="mode-default" [class.active]="mode() === 'default'" (click)="mode.set('default')">Default toolbar</button>
    <button data-testid="mode-custom" [class.active]="mode() === 'custom'" (click)="mode.set('custom')">Custom layout</button>
    <button data-testid="mode-ngmodel" [class.active]="mode() === 'ngmodel'" (click)="mode.set('ngmodel')">ngModel</button>
    <button data-testid="mode-notion" [class.active]="mode() === 'notion'" (click)="mode.set('notion')">Notion style</button>
    <button data-testid="mode-notion-scrollable" [class.active]="mode() === 'notion-scrollable'" (click)="mode.set('notion-scrollable')">Notion scrollable</button>
    <button data-testid="mode-multi" [class.active]="mode() === 'multi'" (click)="mode.set('multi')">Multiple editors</button>
    <button data-testid="mode-tab" [class.active]="mode() === 'tab'" (click)="mode.set('tab')">Tab + lists</button>
  </div>

  @if (isNotion()) {
    <!-- @switch with mode as discriminator forces a fresh component instance
         when switching between the two Notion variants - matches the vanilla
         demo's destroy + recreate behaviour on mode change. -->
    @switch (mode()) {
      @case ('notion') {
        <app-notion-demo [i18n]="editorI18n()" />
      }
      @case ('notion-scrollable') {
        <app-notion-demo [i18n]="editorI18n()" [scrollable]="true" />
      }
    }
  } @else if (mode() === 'multi') {
    <app-multi-editor-demo [i18n]="editorI18n()" />
  } @else if (mode() === 'tab') {
    <app-tab-indent-demo [i18n]="editorI18n()" />
  } @else if (mode() === 'ngmodel') {
    <app-ngmodel-demo [i18n]="editorI18n()" />
  } @else {
    <app-editor-demo [i18n]="editorI18n()" [useLayout]="useLayout()" />
  }
</div>
