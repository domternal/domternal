<div
  #pageEl
  class="notion-page"
  [class.notion-page--scrollable]="scrollable()"
>
  <domternal-editor
    #ec
    preset="notion"
    [extensions]="extensions()"
    [content]="editorContent"
    (editorCreated)="onEditorCreated($event)"
  />

  @if (editor(); as ed) {
    <domternal-bubble-menu [editor]="ed" [icons]="$any(bubbleIcons())" [contexts]="bubbleContexts()" />
    <domternal-floating-menu [editor]="ed" [requireExplicitTrigger]="true" />
    <domternal-notion-color-picker [editor]="ed" />
  }
</div>

<h3>HTML Output</h3>
<pre class="output">{{ ec.htmlContent() }}</pre>

<h3>Styled HTML Output</h3>
<pre class="output-styled">{{ getStyledHtml(ec.htmlContent()) }}</pre>
