packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"
  # The published 1.2.0 packages, installed by test:mixed-version as a project of their own.
  - "!tests/mixed-version/v1.2.0"
  - "domternal.dev"

autoInstallPeers: true

# Do not resolve packages published in the last 24 hours. This leaves time for
# compromised releases to be detected and removed before they enter a lockfile.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # These scopes are published by this project and must be deployable immediately.
  - "@domternal/*"
  - "@domternal-pro/*"
blockExoticSubdeps: true

allowBuilds:
  esbuild: true
  nx: true
  sharp: true
