name: Paste cleanup browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}
  schedule:
    - cron: '7 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paste-cleanup-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      FORCE_COLOR: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check committed locale output before builds
        run: node tests/i18n/generate-locales.mjs --check

      - name: Build the public packages before starting browsers
        # The fixture imports public dist from all four wrappers. Complete all
        # builds before Vite starts so output cannot change during a test run.
        run: pnpm build

      - name: Install the locked Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run paste cleanup browser coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/paste-cleanup
          log='test-results/paste-cleanup/browsers.log'
          report="$GITHUB_WORKSPACE/test-results/paste-cleanup/browsers.json"
          start=$(date +%s)
          runner_pid=''
          monitor_pid=''

          # ShellCheck cannot infer that traps invoke this function.
          # shellcheck disable=SC2317
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ -n "$runner_pid" ]]; then
              kill -- "-$runner_pid" 2>/dev/null || true
              wait "$runner_pid" 2>/dev/null || true
            fi
            if [[ -n "$monitor_pid" ]]; then
              kill "$monitor_pid" 2>/dev/null || true
              wait "$monitor_pid" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          PLAYWRIGHT_JSON_OUTPUT_NAME="$report" setsid pnpm test:e2e:paste-cleanup \
            --workers=2 --retries=0 --reporter=list,json \
            --output='test-results/paste-cleanup/browsers' > "$log" 2>&1 &
          runner_pid=$!
          (
            last_fail=0
            last_report="$start"
            while kill -0 "$runner_pid" 2>/dev/null; do
              now=$(date +%s)
              failed=$(grep -cE '^[[:space:]]*(✘|×)[[:space:]]+[0-9]+' "$log" || true)
              if (( failed > last_fail )); then
                awk -v previous="$last_fail" \
                  '/^[[:space:]]*(✘|×)[[:space:]]+[0-9]+/ { if (++seen > previous) print "NEW FAILURE: " $0 }' "$log"
                last_fail="$failed"
              fi
              if (( now - last_report >= 120 )); then
                awk -v elapsed="$((now - start))" '
                  /^Running [0-9]+ tests/ { total = $2 }
                  /^[[:space:]]*(✓|✘|×|-)[[:space:]]+[0-9]+/ { done++; active = $0 }
                  /^[[:space:]]*✓[[:space:]]+[0-9]+/ { passed++ }
                  /^[[:space:]]*(✘|×)[[:space:]]+[0-9]+/ { failed++ }
                  /^[[:space:]]*-[[:space:]]+[0-9]+/ { skipped++ }
                  END {
                    remaining = total - done
                    eta = done ? int(elapsed * remaining / done) "s" : "unknown"
                    printf "paste-cleanup: %d/%d completed, %d passed, %d failed, %d skipped, 0 retries, %ds elapsed, %d remaining, ETA %s\n", done, total, passed, failed, skipped, elapsed, remaining, eta
                    print "Latest test: " (active ? active : "server startup")
                  }' "$log"
                last_report="$now"
              fi
              sleep 2
            done
          ) &
          monitor_pid=$!

          status=0
          wait "$runner_pid" || status=$?
          runner_pid=''
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          monitor_pid=''
          cat "$log"
          echo "paste-cleanup finished with exit $status in $(($(date +%s) - start))s"
          exit "$status"

      - name: Preserve paste cleanup logs, reports and failure traces
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paste-cleanup-browser-results
          path: test-results/paste-cleanup/
          if-no-files-found: warn
          retention-days: 7
