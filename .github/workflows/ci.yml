name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Consumer type-surface test
        # Type-checks against the built dist (no @domternal/source
        # condition) so every RawCommands augmentation must stay visible
        # to external npm consumers.
        run: pnpm test:types-consumer

      - name: Type check demo apps
        # Demos don't extend the base tsconfig, so they resolve
        # @domternal/* via the standard import condition into the built
        # dist. This catches consumer-facing dist regressions the
        # source-condition typecheck above can't see. Explicit calls
        # bypass nx cache.
        run: |
          pnpm --filter demo-angular typecheck
          pnpm --filter demo-react typecheck
          pnpm --filter demo-vue typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: >-
            ./packages/core/coverage/lcov.info,
            ./packages/extension-block-menu/coverage/lcov.info,
            ./packages/extension-code-block-lowlight/coverage/lcov.info,
            ./packages/extension-details/coverage/lcov.info,
            ./packages/extension-emoji/coverage/lcov.info,
            ./packages/extension-image/coverage/lcov.info,
            ./packages/extension-mention/coverage/lcov.info,
            ./packages/extension-table/coverage/lcov.info,
            ./packages/extension-toc/coverage/lcov.info

      - name: Validate packages
        run: |
          # Use `pnpm exec` so the workspace's pinned versions of publint and
          # @arethetypeswrong/cli are used. The root `pnpm.overrides` pins
          # `@arethetypeswrong/core>fflate` to 0.7.4 to work around a bug where
          # fflate 0.8.x Gunzip fires its callback multiple times (last chunk
          # empty), which makes attw 0.14.0+ crash with
          # "Cannot read properties of undefined (reading 'filename')".
          for pkg in packages/pm packages/core packages/theme packages/angular packages/react packages/vue packages/vanilla packages/extension-block-menu packages/extension-table packages/extension-image packages/extension-emoji packages/extension-mention packages/extension-details packages/extension-code-block-lowlight packages/extension-toc; do
            echo "--- Validating $pkg ---"
            cd "$pkg"
            pnpm exec publint
            if [ "$pkg" != "packages/theme" ] && [ "$pkg" != "packages/angular" ]; then
              if [ "$pkg" = "packages/react" ] || [ "$pkg" = "packages/vue" ] || [ "$pkg" = "packages/vanilla" ]; then
                pnpm exec attw --pack --profile esm-only
              else
                pnpm exec attw --pack
              fi
            fi
            cd "$GITHUB_WORKSPACE"
          done
