name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Forbid relative-path module augmentations
        # Tsup dts bundling does not preserve `declare module '../...'`
        # paths, so any relative-path augmentation silently disappears
        # from the published surface. Always augment by package name.
        run: |
          matches=$(grep -rn "declare module '\." packages/*/src 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo ""
            echo "Use a package name (e.g. '@domternal/core') instead of a relative path."
            exit 1
          fi

      - name: Forbid direct prosemirror-* imports
        # Everything must go through @domternal/pm, which is the single
        # place a consumer can pin. A direct import resolves against the
        # importing package's own node_modules, which is how a second copy
        # of an identity-compared module gets into a bundle.
        run: |
          matches=$(grep -rnE "from '(prosemirror-[a-z-]+)'" packages/*/src --include=*.ts --include=*.tsx --include=*.mts --include=*.cts --include=*.js --include=*.jsx --include=*.mjs --include=*.cjs 2>/dev/null | grep -v '^packages/pm/' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo ""
            echo "Import from '@domternal/pm/<subpath>' instead."
            exit 1
          fi

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Consumer type-surface test
        # Type-checks against the built dist (no @domternal/source
        # condition) so every RawCommands augmentation must stay visible
        # to external npm consumers.
        run: pnpm test:types-consumer

      - name: API surface snapshot
        # Fails if any package's public export list drifts from the
        # committed snapshot. Forces intentional review of add/remove/
        # rename to public API.
        run: pnpm test:api-surface

      # Embedded third-party material (Phosphor icons, adapted ProseMirror
      # styles) must keep its upstream notices in the published tarballs.
      - name: Third-party notices
        run: pnpm test:third-party-notices

      - name: CSS variable references
        # Fails if a `var(--dm-X)` reference without a fallback has no
        # matching definition.
        run: pnpm test:css-vars

      - name: Bundle size budgets
        # Gzipped dist sizes must stay under the committed budgets.
        run: pnpm test:bundle-size

      - name: Single ProseMirror copy
        # ProseMirror and Yjs compare by identity, so a second locked copy
        # of any of them is a runtime crash rather than extra bytes.
        run: pnpm test:single-prosemirror

      - name: Dedupe entries reach the project root
        # Vite resolves a deduped id from the project root. On Vite 8 an id it
        # cannot reach there is ignored silently, so an app that looks protected
        # is not. No app declares a dedupe list today; this keeps it that way or
        # keeps it honest.
        run: pnpm test:dedupe-reachable

      - name: Frozen single-copy contract
        # Every caller registering a module must pass the SAME export, or two
        # packages that agree report a conflict that does not exist. Nothing in
        # the type system can say that, so it is checked here.
        run: pnpm test:frozen-contract

      - name: Externalised shared modules
        # tsup inlines anything it is not told to externalise, and an inlined
        # copy of an identity-compared module ships that crash to a consumer.
        run: pnpm test:externals

      - name: Type check demo apps
        # Demos don't extend the base tsconfig, so they resolve
        # @domternal/* via the standard import condition into the built
        # dist. This catches consumer-facing dist regressions the
        # source-condition typecheck above can't see. Explicit calls
        # bypass nx cache.
        run: |
          pnpm --filter demo-angular typecheck
          pnpm --filter demo-react typecheck
          pnpm --filter demo-vue typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: >-
            ./packages/core/coverage/lcov.info,
            ./packages/extension-block-controls/coverage/lcov.info,
            ./packages/extension-code-block-lowlight/coverage/lcov.info,
            ./packages/extension-details/coverage/lcov.info,
            ./packages/extension-emoji/coverage/lcov.info,
            ./packages/extension-image/coverage/lcov.info,
            ./packages/extension-markdown/coverage/lcov.info,
            ./packages/extension-math/coverage/lcov.info,
            ./packages/extension-mention/coverage/lcov.info,
            ./packages/extension-table/coverage/lcov.info,
            ./packages/extension-toc/coverage/lcov.info

      - name: Validate packages
        run: |
          # Use `pnpm exec` so the workspace's pinned versions of publint and
          # @arethetypeswrong/cli are used. The root `pnpm.overrides` pins
          # `@arethetypeswrong/core>fflate` to 0.7.4 to work around a bug where
          # fflate 0.8.x Gunzip fires its callback multiple times (last chunk
          # empty), which makes attw 0.14.0+ crash with
          # "Cannot read properties of undefined (reading 'filename')".
          for pkg in packages/pm packages/core packages/theme packages/angular packages/react packages/vue packages/vanilla packages/extension-block-controls packages/extension-block-menu packages/extension-table packages/extension-image packages/extension-math packages/extension-emoji packages/extension-mention packages/extension-details packages/extension-code-block-lowlight packages/extension-markdown packages/extension-toc; do
            echo "--- Validating $pkg ---"
            cd "$pkg"
            pnpm exec publint --strict
            if [ "$pkg" != "packages/theme" ] && [ "$pkg" != "packages/angular" ]; then
              if [ "$pkg" = "packages/react" ] || [ "$pkg" = "packages/vue" ] || [ "$pkg" = "packages/vanilla" ]; then
                pnpm exec attw --pack --profile esm-only
              else
                pnpm exec attw --pack
              fi
            fi
            cd "$GITHUB_WORKSPACE"
          done
