name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}
  schedule:
    # Exercises the pinned Node/runner/toolchain even when main is quiet.
    - cron: '17 4 * * 1'

# A newer run supersedes an older run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default every job to the smallest repository permission. Only the isolated
# coverage job adds the short-lived OIDC permission Codecov needs; no long-lived
# upload token is exposed to pull-request code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # The whole job takes a few minutes. The GitHub default is six hours, which
    # is what a hung vitest or tsc would otherwise burn.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        # actionlint has no first-party JS action. Download the versioned binary
        # and verify its published digest before executing it.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          printf '%s\n' '{}' > "$RUNNER_TEMP/actionlint.yaml"
          "$RUNNER_TEMP/actionlint" -config-file "$RUNNER_TEMP/actionlint.yaml" -color

      - name: Setup pnpm
        # v6.0.9 regressed projects that pin pnpm 10; v6.0.8 is the latest
        # verified release for this repository until that upstream issue closes.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every declared gate runs here
        # A gate in package.json that no step invokes passes locally, never runs
        # on a pull request, and reads as coverage that does not exist. Cheap and
        # early, because it needs nothing built.
        # These two explicit values also keep workflow/job run defaults from
        # replacing or relocating the checker before it can reject them.
        shell: bash
        working-directory: ${{ github.workspace }}
        run: pnpm test:ci-wiring

      - name: Lint
        run: pnpm lint

      - name: Source boundary policy
        # AST-based: covers both quote styles plus import, export, dynamic
        # import, require and import-type syntax without matching comments.
        run: pnpm test:source-boundaries

      - name: Type check
        run: pnpm typecheck

      - name: Type check the e2e suite
        # e2e/ is not a workspace member and not an nx project, so the run above
        # cannot reach it. It was the largest body of TypeScript here that
        # nothing checked, and every new cross-framework spec is added to it.
        run: pnpm typecheck:e2e

      - name: Build
        run: pnpm build

      - name: Consumer type-surface test
        # Type-checks against the built dist (no @domternal/source
        # condition) so every RawCommands augmentation must stay visible
        # to external npm consumers.
        run: pnpm test:types-consumer

      - name: API surface snapshot
        # Fails if any package's public export list drifts from the
        # committed snapshot. Forces intentional review of add/remove/
        # rename to public API.
        run: pnpm test:api-surface

      # Embedded third-party material (Phosphor icons, adapted ProseMirror
      # styles) must keep its upstream notices in the published tarballs.
      - name: Third-party notices
        run: pnpm test:third-party-notices

      - name: The hidden attribute survives the theme
        # Author styles beat the user agent stylesheet, so every `display` in
        # the theme is a chance to disable `[hidden]` silently. One scoped rule
        # restores it; this keeps that rule, and keeps new components inside it.
        run: pnpm test:hidden-attribute

      - name: CSS variable references
        # Fails if a `var(--dm-X)` reference without a fallback has no
        # matching definition.
        run: pnpm test:css-vars

      - name: Light and dark palettes agree
        # The two theme mixins are a matched pair, and the print layer re-emits
        # the light one over a dark document. A token added to one mixin alone
        # is caught by nothing else: Sass compiles both halves happily, and the
        # gate above asks only whether a name is defined somewhere.
        run: pnpm test:theme-tokens

      - name: Bundle size budgets
        # Gzipped dist sizes must stay under the committed budgets.
        run: pnpm test:bundle-size

      - name: Single ProseMirror copy
        # ProseMirror and Yjs compare by identity, so a second locked copy
        # of any of them is a runtime crash rather than extra bytes.
        run: pnpm test:single-prosemirror

      - name: Cross-repository policy unit suites
        # The full checks need the sibling Pro checkout and remain local-only.
        # Their parsers and contract fixtures are deterministic and belong in CI.
        run: |
          pnpm test:dedupe-reachable:unit
          pnpm test:pm-ranges:unit

      - name: Frozen single-copy contract
        # Every caller registering a module must pass the SAME export, or two
        # packages that agree report a conflict that does not exist. Nothing in
        # the type system can say that, so it is checked here.
        run: pnpm test:frozen-contract

      - name: Externalised shared modules
        # tsup inlines anything it is not told to externalise, and an inlined
        # copy of an identity-compared module ships that crash to a consumer.
        run: pnpm test:externals

      - name: SSR import smoke
        # Nothing else here ever executes a built bundle: the type checks run
        # tsc, publint and attw resolve without loading, everything else is
        # static analysis. One top-level document or window breaks every
        # Next.js, Remix, Nuxt and Astro consumer before their first render.
        run: pnpm test:ssr-import

      - name: Package manifest policy
        # Releases are hand-edited across eighteen manifests. A version bumped
        # without its `>=MAJOR.MINOR.0` floors publishes a package a consumer
        # may legally install beside the previous minor, which is the mixed-copy
        # install the single-copy gates exist to prevent.
        run: pnpm test:package-policy

      - name: Packed tarball policy
        # What npm actually ships, rather than what the working tree holds.
        # 0.15.0 published the core with inlined icon artwork and no notice at
        # all: npm carries LICENSE by itself but never THIRD-PARTY-LICENSES.md,
        # and nothing looked inside a tarball.
        run: pnpm test:package-artifacts

      - name: Type check demo apps
        # Two steps, and only the second one decides what is read. The demo
        # tsconfigs enable the @domternal/source condition, so resolution lands
        # on packages/*/src; each demo then declares a project reference to
        # every package it imports, and tsc redirects a referenced project's
        # source to its emitted declaration. So this pass reads dist. Settled by
        # mutation rather than by reading the trace: breaking an export in
        # dist/index.d.ts fails this step, breaking the same export in
        # src/index.ts does not. Explicit calls bypass the nx cache.
        run: |
          pnpm --filter demo-angular typecheck
          pnpm --filter demo-react typecheck
          pnpm --filter demo-vanilla typecheck
          pnpm --filter demo-vue typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Require every coverage report
        # A package disappearing from Codecov is a failure, not a smaller upload.
        run: pnpm test:coverage-reports

      - name: Preserve coverage for the isolated upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          # Upload only inert coverage data. Never pass a repository-created
          # archive into the OIDC job or extract one into its filesystem.
          path: |
            packages/core/coverage/lcov.info
            packages/extension-block-controls/coverage/lcov.info
            packages/extension-block-menu/coverage/lcov.info
            packages/extension-code-block-lowlight/coverage/lcov.info
            packages/extension-details/coverage/lcov.info
            packages/extension-emoji/coverage/lcov.info
            packages/extension-image/coverage/lcov.info
            packages/extension-markdown/coverage/lcov.info
            packages/extension-math/coverage/lcov.info
            packages/extension-mention/coverage/lcov.info
            packages/extension-table/coverage/lcov.info
            packages/extension-toc/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Validate packages
        run: |
          # Use `pnpm exec` so the workspace's pinned versions of publint and
          # @arethetypeswrong/cli are used. The root `pnpm.overrides` pins
          # `@arethetypeswrong/core>fflate` to 0.7.4 to work around a bug where
          # fflate 0.8.x Gunzip fires its callback multiple times (last chunk
          # empty), which makes attw 0.14.0+ crash with
          # "Cannot read properties of undefined (reading 'filename')".
          for pkg in packages/angular packages/core packages/extension-block-controls packages/extension-block-menu packages/extension-code-block-lowlight packages/extension-details packages/extension-emoji packages/extension-image packages/extension-markdown packages/extension-math packages/extension-mention packages/extension-table packages/extension-toc packages/pm packages/react packages/theme packages/vanilla packages/vue; do
            echo "--- Validating $pkg ---"
            cd "$pkg"
            pnpm exec publint --strict
            if [ "$pkg" != "packages/theme" ] && [ "$pkg" != "packages/angular" ]; then
              if [ "$pkg" = "packages/react" ] || [ "$pkg" = "packages/vue" ] || [ "$pkg" = "packages/vanilla" ]; then
                pnpm exec attw --pack --profile esm-only
              else
                pnpm exec attw --pack
              fi
            fi
            cd "$GITHUB_WORKSPACE"
          done

  coverage:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No repository-controlled dependency or test code executes in this job.
    # The downloaded artifact contains only the fixed lcov allowlist; no
    # repository-created nested archive is executed or manually extracted.
    # OIDC exists only here and only the pinned Codecov action consumes it.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout coverage commit metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
          # upload-artifact stores paths below their common `packages/` root.
          # Restore them beside their source so lcov's package-relative SF
          # entries resolve without relying on a remote path-fixing heuristic.
          path: ${{ github.workspace }}/packages

      - name: Verify the fixed coverage allowlist
        shell: bash
        run: |
          set -euo pipefail
          for report in \
            "$GITHUB_WORKSPACE/packages/core/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-block-controls/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-block-menu/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-code-block-lowlight/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-details/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-emoji/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-image/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-markdown/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-math/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-mention/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-table/coverage/lcov.info" \
            "$GITHUB_WORKSPACE/packages/extension-toc/coverage/lcov.info"; do
            if [ ! -f "$report" ] || [ -L "$report" ] || [ ! -s "$report" ]; then
              echo "Coverage artifact is missing a regular, non-empty report: $report" >&2
              exit 1
            fi
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # Fork PRs use Codecov's public-repository tokenless upload. Trusted
          # events authenticate with a short-lived GitHub OIDC assertion.
          use_oidc: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
          version: v11.3.1
          fail_ci_if_error: true
          disable_search: true
          files: ${{ github.workspace }}/packages/core/coverage/lcov.info,${{ github.workspace }}/packages/extension-block-controls/coverage/lcov.info,${{ github.workspace }}/packages/extension-block-menu/coverage/lcov.info,${{ github.workspace }}/packages/extension-code-block-lowlight/coverage/lcov.info,${{ github.workspace }}/packages/extension-details/coverage/lcov.info,${{ github.workspace }}/packages/extension-emoji/coverage/lcov.info,${{ github.workspace }}/packages/extension-image/coverage/lcov.info,${{ github.workspace }}/packages/extension-markdown/coverage/lcov.info,${{ github.workspace }}/packages/extension-math/coverage/lcov.info,${{ github.workspace }}/packages/extension-mention/coverage/lcov.info,${{ github.workspace }}/packages/extension-table/coverage/lcov.info,${{ github.workspace }}/packages/extension-toc/coverage/lcov.info
